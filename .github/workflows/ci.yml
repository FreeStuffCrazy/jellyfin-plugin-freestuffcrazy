name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The tests build against Jellyfin 12.4 on .NET 10.
      - run: dotnet test tests/Jellyfin.Plugin.FreeStuffCrazy.Tests -c Release

  package:
    # Builds and zips the plugin for every Jellyfin line in lines.json, so a
    # line that stops compiling is caught here and not when releasing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python3 scripts/release.py --version 0.0.0 --out artifacts
